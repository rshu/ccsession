name: Publish to PyPI

# Publishes the distribution when a version tag (v2.1.0, v2.2.0, ...) is pushed.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in the repository.
# One-time setup on PyPI: project "ccsession-cli" -> Publishing -> add GitHub
# publisher with owner "rshu", repository "ccsession", workflow "publish.yml",
# environment "pypi".
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import ccsession; print(ccsession.CCSESSION_VERSION)")
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$version" >&2; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Pinned to a commit (release/v1 branch, v1.14.2); Dependabot keeps it current.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
